# Compile the whole fleet + the bb8 CLI on every push/PR to main.
# Cores/libs are pinned to the same versions Install-ZClass.ps1 installs,
# so green here means the release toolchain builds it too.
name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache Arduino cores + libraries
        uses: actions/cache@v4
        with:
          path: |
            ~/.arduino15
            ~/Arduino/libraries
          key: arduino-${{ runner.os }}-bluepad32_4.1.0-esp32_3.3.7-avr_1.4.15-samd_1.7.17-v1

      - name: Install arduino-cli
        uses: arduino/setup-arduino-cli@v2

      - name: Install cores + libraries
        run: |
          arduino-cli config init --overwrite
          arduino-cli config add board_manager.additional_urls \
            https://raw.githubusercontent.com/ricardoquesada/esp32-arduino-lib-builder/master/bluepad32_files/package_esp32_bluepad32_index.json \
            https://espressif.github.io/arduino-esp32/package_esp32_index.json \
            https://adafruit.github.io/arduino-board-index/package_adafruit_index.json
          # index hosts (github.io) 404 transiently from CI — retry with backoff
          for i in 1 2 3 4; do
            arduino-cli core update-index && break
            echo "update-index failed (attempt $i) — retrying in 20s"; sleep 20
          done
          arduino-cli core install esp32-bluepad32:esp32@4.1.0
          arduino-cli core install esp32:esp32@3.3.7
          arduino-cli core install adafruit:avr@1.4.15
          arduino-cli core install adafruit:samd@1.7.17
          arduino-cli lib install SerialTransfer DFRobotDFPlayerMini "Adafruit MPU6050" "Adafruit Unified Sensor" "Adafruit BusIO" "Kalman Filter Library" "Adafruit NeoPixel" Servo

      - name: Compile drive (ESP32_DRIVE_RC4)
        run: arduino-cli compile --fqbn esp32-bluepad32:esp32:featheresp32 firmware/ESP32_DRIVE_RC4 --warnings default

      - name: Compile dome (ESP32_DOME_RC4)
        run: arduino-cli compile --fqbn esp32:esp32:featheresp32 firmware/ESP32_DOME_RC4 --warnings default

      - name: Compile body (32U4_DRIVE_RC4)
        run: arduino-cli compile --fqbn adafruit:avr:feather32u4 firmware/32U4_DRIVE_RC4 --warnings default

      - name: Compile imu (TrinketM0_MPU_RC4)
        run: arduino-cli compile --fqbn adafruit:samd:adafruit_trinket_m0 firmware/TrinketM0_MPU_RC4 --warnings default

  bb8-cli:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build bb8
        run: dotnet build tools/Bb8Commander -c Release --nologo
